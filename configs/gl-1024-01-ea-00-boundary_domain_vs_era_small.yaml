dates:
  start: 2020-01-02 00:00:00
  end: 2020-12-31 00:00:00
  frequency: 1D

datastores:
  gl-1024-01-ea-00-boundary_domain:
    type: anemoi-inference
    path: /scratch/project_465000527/vandenbl/sg-la-comparison/inference-out/gl-1024-01-ea-00-global_domain/{yyyy}{mm}{dd}{HH}.nc
    subgrid_idx: index_boundary_domain_o96.npz
    stacked: false
    variables: ['10u', '10v', '2d', '2t', 'msl', 'q_500', 'skt', 'sp', 't_500', 'u_500', 'z_500']

  era:
    type: anemoi-inference
    path: /scratch/project_465000527/vandenbl/sg-la-comparison/inference-out/gl-1024-01-ea-00-era5/{yyyy}{mm}{dd}{HH}.nc
    subgrid_idx: index_boundary_domain_o96.npz
    era_hack: true
    stacked: false
    variables: ['10u', '10v', '2d', '2t', 'msl', 'q_500', 'skt', 'sp', 't_500', 'u_500', 'z_500']

transformations:
  uv_to_speed:
    datastores:
      - gl-1024-01-ea-00-boundary_domain
      - era
    u: 10u
    v: 10v
    speed: 10s

verification:
  reference_datastore: era    
  variables : ['10s', '2d', '2t', 'msl', 'q_500', 'skt', 'sp', 't_500', 'u_500', 'z_500']
  clusters:
    temporal:
      package : scores
      metrics:
        - mse
        - bias
      avg_dims: [reference_time]

output:
  type: netcdf
  temporal:
    path: /scratch/project_465000527/vandenbl/sg-la-comparison/scores/gl-1024-01-ea-00-boundary_domain_vs_era_small.nc
