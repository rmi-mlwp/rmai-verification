dates:
  start: 2020-01-02 00:00:00
  end: 2020-12-25 00:00:00
  frequency: 1D

datastores:
  sg-1024-12-od-00:
    type: anemoi-inference
    path: /scratch/project_465000527/vandenbl/sg-la-comparison/inference-out/sg-1024-12-od-00/{yyyy}{mm}{dd}{HH}.nc
    variables : ['10u', '10v', '2d', '2t', 'msl']
  synop:
    type: point-observations
    path: /scratch/project_465001235/datasets/observations/cerra_synops_2020.nc

transformations:
  rename:
    rename_dict:
      2t: [2t_2, T2M]
      2d: [2d_2, TD2M]
      10u: [10u_10, U10M]
      10v: [10v_10, V10M]
      10s: [S10M, 10s_10, 10si]
      msl: [msl_0, MLSP]
  uv_to_speed:
    datastores:
      - sg-1024-12-od-00
    u: 10u
    v: 10v
    speed: 10s
  kelvin_to_celcius:
    datastores:
      - sg-1024-12-od-00
    fields: [2t, 2d]

verification:
  reference_datastore: synop    
  variables : ['10s','2d', '2t', 'msl']
  clusters:
    temporal:
      package : scores
      metrics:
        - mse
        - bias
      avg_dims: [reference_time]

output:
  type: netcdf
  temporal:
    path: /scratch/project_465000527/vandenbl/sg-la-comparison/scores/sg-1024-12-od-00_vs_synop.nc
