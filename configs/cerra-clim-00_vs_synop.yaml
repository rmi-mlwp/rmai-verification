dates:
  start: 2020-01-02 00:00:00
  end: 2020-12-25 00:00:00
  frequency: 1D

datastores:
  cerra-clim-00:
    type: climatological-forecast
    path: /scratch/project_465001235/datasets/cerra-rr-an-oper-0001-mars-5p5km-1985-2019-3h-v2-rmi-clim-v2.zarr@{yyyy}{mm}{dd}_{HH}@lt_max:144h@lt_step:6h
    variables : ['10u_10', '10v_10', '2t_2', 'msl_0']
  synop:
    type: point-observations
    path: /scratch/project_465001235/datasets/observations/cerra_synops_2020.nc

transformations:
  rename:
    rename_dict:
      2t: [2t_2, T2M]
      2d: [2d_2, TD2M]
      10u: [10u_10, U10M]
      10v: [10v_10, V10M]
      10s: [S10M, 10s_10, 10si]
      msl: [msl_0, MLSP]
  uv_to_speed:
    datastores:
      - cerra-clim-00
    u: 10u
    v: 10v
    speed: 10s
  kelvin_to_celcius:
    datastores:
      - cerra-clim-00
    fields: [2t]
  hectoPascal_to_Pascal:
    datastores:
      - synop
    fields: [msl]

verification:
  reference_datastore: synop    
  variables : ['10s', '2t', 'msl']
  clusters:
    temporal:
      package : scores
      metrics:
        - mse
        - bias
      avg_dims: [reference_time]

output:
  type: netcdf
  temporal:
    path: /scratch/project_465000527/vandenbl/sg-la-comparison/scores/cerra-clim-00_vs_synop_full.nc
